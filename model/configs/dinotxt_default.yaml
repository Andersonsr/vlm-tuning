model:
  name: DINOtxt:ViT-L/16  # off-the-shelf DINO-TXT: its own backbone, vision head and text tower (pretrained weights)
  temperature: 100.0
  image_size: 224
  vision_head_only: false  # DINOtxt only (--vision_head): of the vision tower only DINO-TXT's vision head trains (backbone frozen); the text tower gets LoRA with lora.apply, else is fully fine-tuned
  average_local: true  # DINO-TXT's own 2048-d embeddings (image: CLS + mean patch); false keeps only the first 1024 dims
  backbone_weights: null  # null: DINO-TXT's own backbone (off the shelf); a DINOv3 SSL checkpoint would replace it
  backbone_branch: teacher # teacher (EMA, used by DINOv3's evaluation) or student weights of backbone_weights
  lora:
    apply: true
    lib: 'peft' # loratorch, cliplora, peft
    r: 12
    alpha: 24
    dropout_rate: 0.25
    params: ['q', 'k', 'v', 'o']
    encoder: 'both' # both, vision, text
    position: 'all' # layers to apply lora, check lora utils
  residual_adapter:
    apply: false
    target: 'both' # 'vision', 'text', 'both'
    alpha: 0.5
    bottleneck_reduction: 4
  calibrate: false
  load_weights: false # false or path to file
  train_temperature: false
  sigmoid_bias: -10 # initial bias of the siglip loss
  train_bias: false # learn the sigmoid bias (siglip loss only)
train:
  loss: 'contrastive' # 'contrastive' (CLIP softmax) or 'siglip' (sigmoid)
  batch_size: 192 # * n_gpus
  gpus: 1
  nnodes: 1  # (--nnodes)
  accelerator: gpu  # gpu, cpu or auto (--accelerator)
  strategy: auto  # auto, fsdp or deepspeed_stage_2 (--strategy)
  epochs: 200
  local_loss: false 
  learning_rate: 0.0005  # peak learning rate (after the warm-up)
  optimizer:  # OpenCLIP defaults
    name: adamw  # adamw, or adam (weight decay as L2)
    weight_decay: 0.2  # not on biases, gains/norms (1-d parameters) or the temperature
    betas: [0.9, 0.98]
    eps: 1.0e-6
    schedule: cosine  # cosine (after the warm-up) or constant
    warmup: 0.05  # fraction of the training steps when < 1 (0.05: 5%), or warm-up steps (e.g. 10000, as OpenCLIP)
    min_lr_ratio: 0.0  # cosine decays to min_lr_ratio * learning_rate
    head_lr: null  # learning rate of new heads (DualEncoder heads, DINOtxt vision head); null: learning_rate
    grad_clip: null  # gradient norm clipping; null: none
  monitor: 'val_loss'  # mean over the validation fields; or 'mean_t2i r@5', or one field: composition_val_loss, 'composition_t2i r@5' (quote names with a space: --set "train.monitor=composition_t2i r@5")
  multi_positive: false
  cooling:
    apply: false  # temperature fixed at model.temperature; or 'step', 'linear', 'cosine', 'log' (linear in log space) to cool it to final_temp
    final_temp: 30.0
    iterations: 1.0 # cooling duration, total batches ratio
dataset:
  name: 'geo' # 'nwpu', 'coco', 'geo'
  multiresolution: false  # geo: train and validate on both resolutions (--multiresolution)
  root: '/nethome/atena_projetos/fvlk/data/Dataset/v4/images'
  train_annotation: '/nethome/atena_projetos/fibz/data/Dataset/v4/train.csv'
  val_annotation: '/nethome/atena_projetos/fibz/data/Dataset/v4/val.csv'
  test_annotation: '/nethome/atena_projetos/fibz/data/Dataset/v4/test.csv' 
  random: true
  geometric_aug: false # random crop shift (up to 20%), horizontal flip and 90 degree rotations, no interpolation (train only)
  spectral_aug: false # equalization, contrast stretch, sharpen, dichromacy, color cast, vignette, brightness (train only)
  p_spectral: 0.8 # probability of applying one of the spectral augmentations when spectral_aug is enabled
  nlm_aug: false # NLM denoising with probability 0.1, slow and needs opencv (train only)
  geo_index: [1] # {0: 'classification', 1: 'composition', 2: 'texture', 3: 'porosity', 4:'diagenesis'}
  geo_index_val: [1] # {0: 'classification', 1: 'composition', 2: 'texture', 3: 'porosity', 4:'diagenesis'}
  geo_group: [2, 3] # user groups 
  resolutions: [256, 512] # image resolution for each magnifications
name: test  # run name (--name): the run is saved in <output_dir>/<name>, with its config.yaml
output_dir: '/nethome/recpinfo/users/fibz/data/checkpoint/vlm-finetuning/'
log_interval: 6
