model:
  name: DualEncoder:ssl-e5large  # DINOv3 SSL vision backbone + HF text encoder, see model/dual_encoder.py
  temperature: 100.0
  image_size: 224
  vision_head_only: false
  average_local: false
  vision:
    repo: facebookresearch/dinov3  # torch hub repo of the backbone (or a local clone with source: local)
    source: github
    arch: dinov3_vitl16  # built without pretrained weights, then loaded from weights
    weights: null  # required: DINOv3 SSL checkpoint ('<branch>.backbone.' keys under 'model')
    branch: teacher  # teacher (EMA) or student weights of the checkpoint
    tokens: cls+patch  # qformer input: 'patch' or 'cls+patch'
    pooled: cls  # mlp/linear input: 'cls' or 'cls+mean' (CLS concatenated with the mean patch token)
  text:
    model_id: intfloat/multilingual-e5-large
    pooling: mean  # mean, cls or last (e5: mean)
    prefix: 'query: '  # e5 expects 'query: ' or 'passage: '
    max_length: 512
    grad_checkpointing: false  # saves memory when LoRA trains the text tower
  aligner:
    vision: qformer  # qformer, mlp or linear
    text: linear  # linear, mlp or none (text embedding kept as is, LiT: embed_dim must be the text dim, 1024)
    embed_dim: 1024  # shared embedding dimension
    queries: 32  # qformer only
    layers: 2
    width: 768
    heads: 12
    dropout: 0.1
    pooling: mean  # qformer outputs pooled by 'mean', taken from the 'first' query, or 'max': BLIP-2, the query with the
                   # highest similarity to the text gives the image-text score
  lora:
    apply: false  # towers are frozen unless LoRA is applied to them
    lib: 'peft'
    r: 12
    alpha: 24
    dropout_rate: 0.25
    encoder: 'text'  # both, vision, text
    vision_targets: ['qkv']
    text_targets: ['query', 'key', 'value']  # XLM-RoBERTa (e5, bge-m3) attention names
    params: ['q', 'k', 'v', 'o']
    position: 'all'
  residual_adapter:
    apply: false
    target: 'both'
    alpha: 0.5
    bottleneck_reduction: 4
  calibrate: false
  load_weights: false
  train_temperature: false
  sigmoid_bias: -10
  train_bias: false
train:
  loss: 'contrastive'  # 'contrastive' (CLIP softmax) or 'siglip' (sigmoid)
  batch_size: 192  # * n_gpus
  gpus: 1
  nnodes: 1  # (--nnodes)
  accelerator: gpu  # gpu, cpu or auto (--accelerator)
  strategy: auto  # auto, fsdp or deepspeed_stage_2 (--strategy)
  epochs: 200
  local_loss: false
  learning_rate: 0.0005  # peak learning rate (after the warm-up)
  optimizer:  # OpenCLIP defaults
    name: adamw  # adamw, or adam (weight decay as L2)
    weight_decay: 0.2  # not on biases, gains/norms (1-d parameters) or the temperature
    betas: [0.9, 0.98]
    eps: 1.0e-6
    schedule: cosine  # cosine (after the warm-up) or constant
    warmup: 10000  # warm-up steps, or a fraction of the training steps when < 1 (e.g. 0.05 for short runs)
    min_lr_ratio: 0.0  # cosine decays to min_lr_ratio * learning_rate
    head_lr: null  # learning rate of new heads (DualEncoder heads, DINOtxt vision head); null: learning_rate
    grad_clip: null  # gradient norm clipping; null: none
  monitor: 'val_loss'  # mean over the validation fields; or mean_t2i_r@5, or one field: composition_val_loss, composition_t2i_r@5
  multi_positive: false
  cooling:
    apply: cosine  # 'step', 'linear', 'cosine' or false
    final_temp: 30.0
    iterations: 1.0
dataset:
  name: 'geo'
  multiresolution: false  # geo: train and validate on both resolutions (--multiresolution)
  root: '/nethome/atena_projetos/fvlk/data/Dataset/v4/images'
  train_annotation: '/nethome/atena_projetos/fibz/data/Dataset/v4/train.csv'
  val_annotation: '/nethome/atena_projetos/fibz/data/Dataset/v4/val.csv'
  test_annotation: '/nethome/atena_projetos/fibz/data/Dataset/v4/test.csv'
  random: true
  geometric_aug: false
  spectral_aug: false
  p_spectral: 0.8
  nlm_aug: false
  geo_index: [1]  # {0: 'classification', 1: 'composition', 2: 'texture', 3: 'porosity', 4:'diagenesis'}
  geo_index_val: [1]
  geo_group: [2, 3]
  resolutions: [256, 512]
name: test  # run name (--name): the run is saved in <output_dir>/<name>, with its config.yaml
output_dir: '/nethome/recpinfo/users/fibz/data/checkpoint/vlm-finetuning/'
log_interval: 6
