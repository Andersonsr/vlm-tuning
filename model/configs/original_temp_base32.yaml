model:
  name: 'CLIP:ViT-B/32' #'DINOtxt:ViT-L/16' 'GeoRSCLIP:ViT-B-32' #'RemoteCLIP:ViT-B-32'    
  vision_head_only: false  # DINOtxt: train the vision head only (--vision_head)
  average_local: false  # DINOtxt: cls + mean patch embedding (--average_local)
  temperature: 5.0 
  image_size: 224 # only for models with variable image size
  lora:
    apply: true
    lib: 'loratorch' #'peft' #  or cliplora
    r: 4
    alpha: 8
    dropout_rate: 0.25
    params: ['q', 'k', 'v', 'o']
    encoder: 'both' # both, vision, text
    position: 'all'
  residual_adapter:
    apply: false
    target: 'both' # 'vision', 'text', 'both'
    alpha: 0.5
    bottleneck_reduction: 4
  calibrate: false
  load_weights: false # false or path to file
  train_temperature: false
  sigmoid_bias: -10 # initial bias of the siglip loss
  train_bias: false # learn the sigmoid bias (siglip loss only)
train:
  loss: 'contrastive' # 'contrastive' (CLIP softmax) or 'siglip' (sigmoid)
  batch_size: 128
  gpus: 1  # gpus per node (--gpus)
  nnodes: 1  # (--nnodes)
  accelerator: gpu  # gpu, cpu or auto (--accelerator)
  strategy: auto  # auto, fsdp or deepspeed_stage_2 (--strategy)
  epochs: 25
  local_loss: false
  monitor: val_loss
  learning_rate: 0.0005  # peak learning rate (after the warm-up)
  optimizer:  # OpenCLIP defaults
    name: adamw  # adamw, or adam (weight decay as L2)
    weight_decay: 0.2  # not on biases, gains/norms (1-d parameters) or the temperature
    betas: [0.9, 0.98]
    eps: 1.0e-6
    schedule: cosine  # cosine (after the warm-up) or constant
    warmup: 10000  # warm-up steps, or a fraction of the training steps when < 1 (e.g. 0.05 for short runs)
    min_lr_ratio: 0.0  # cosine decays to min_lr_ratio * learning_rate
    head_lr: null  # learning rate of new heads (DualEncoder heads, DINOtxt vision head); null: learning_rate
    grad_clip: null  # gradient norm clipping; null: none
  cooling:
    apply: false # 'step', 'linear', 'cosine' or false
    final_temp: 59.32769 
    iterations: 1 # cooling duration, total batches ratio
dataset:
  name: 'nwpu'
  multiresolution: false  # geo: train and validate on both resolutions (--multiresolution)
  root: '/nethome/recpinfo/users/fibz/data/dataset/nwpu/'
  train_annotation: 'train_3.json'
  val_annotation: 'val_3.json'
  random: false
# dataset:
#     name: 'rsicd'
#     root: '/nethome/recpinfo/users/fibz/data/dataset/RSICD/'
#     val_annotation: 'val.json'
#     train_annotation: 'train.json'
#     random: false
name: test  # run name (--name): the run is saved in <output_dir>/<name>, with its config.yaml
output_dir: '/nethome/recpinfo/users/fibz/data/checkpoint/vlm-finetuning/'
log_interval: 100
